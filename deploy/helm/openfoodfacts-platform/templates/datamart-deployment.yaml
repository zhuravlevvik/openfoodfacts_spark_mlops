{{- if .Values.dataMart.enabled }}
{{- if not .Values.hbase.enabled }}
{{- fail "dataMart.enabled requires hbase.enabled" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openfoodfacts.fullname" . }}-data-mart
  labels:
    {{- include "openfoodfacts.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-mart
spec:
  replicas: {{ .Values.dataMart.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "openfoodfacts.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: data-mart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "openfoodfacts.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: data-mart
    spec:
      initContainers:
        - name: wait-for-hbase
          image: {{ include "openfoodfacts.image" .Values.images.model | quote }}
          imagePullPolicy: {{ .Values.images.model.pullPolicy }}
          command: ["python3", "-m", "openfoodfacts_cluster.jobs.wait_for_http"]
          args:
            - --url
            - http://{{ include "openfoodfacts.fullname" . }}-hbase:{{ .Values.hbase.servicePort }}/version/cluster
            - --timeout
            - "300"
      containers:
        - name: data-mart
          image: {{ include "openfoodfacts.image" .Values.images.dataMart | quote }}
          imagePullPolicy: {{ .Values.images.dataMart.pullPolicy }}
          args:
            - --master
            - local[2]
            - --driver-memory
            - 512m
            - --class
            - edu.itmo.datamart.Main
            - /opt/application/data-mart.jar
          env:
            - name: SPARK_LOCAL_IP
              value: 127.0.0.1
            - name: HBASE_ZOOKEEPER_QUORUM
              value: {{ include "openfoodfacts.fullname" . }}-hbase
            - name: HBASE_ZOOKEEPER_PORT
              value: "2181"
            - name: DATA_MART_HOST
              value: 0.0.0.0
            - name: DATA_MART_PORT
              value: {{ .Values.dataMart.servicePort | quote }}
            - name: DATA_MART_PAGE_LIMIT
              value: {{ .Values.dataMart.pageLimit | quote }}
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 90
            periodSeconds: 15
          resources:
            {{- toYaml .Values.dataMart.resources | nindent 12 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "openfoodfacts.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: data-mart
{{- end }}

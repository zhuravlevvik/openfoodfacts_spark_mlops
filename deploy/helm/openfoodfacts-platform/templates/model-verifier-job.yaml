{{- if .Values.model.enabled }}
{{- $mode := .Values.model.mode }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openfoodfacts.fullname" . }}-verify-{{ $mode }}-{{ .Release.Revision }}
  labels:
    {{- include "openfoodfacts.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-verifier
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "openfoodfacts.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: model-verifier
    spec:
      serviceAccountName: {{ include "openfoodfacts.serviceAccountName" . }}
      restartPolicy: Never
      containers:
        - name: verifier
          image: {{ include "openfoodfacts.image" .Values.images.model | quote }}
          imagePullPolicy: {{ .Values.images.model.pullPolicy }}
          command: ["python3", "-m", "openfoodfacts_cluster.jobs.verify_spark_application"]
          args:
            - --namespace
            - {{ .Release.Namespace }}
            - --app-name
            - openfoodfacts-{{ $mode }}-r{{ .Release.Revision }}
            - --timeout
            - "1100"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
{{- end }}
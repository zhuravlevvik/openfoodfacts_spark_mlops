{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openfoodfacts.serviceAccountName" . }}
  labels:
    {{- include "openfoodfacts.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openfoodfacts.fullname" . }}-spark
  labels:
    {{- include "openfoodfacts.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openfoodfacts.fullname" . }}-spark
  labels:
    {{- include "openfoodfacts.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "openfoodfacts.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openfoodfacts.fullname" . }}-spark
{{- end }}
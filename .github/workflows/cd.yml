name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Published GHCR image tag to verify
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  published-images-acceptance:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Resolve source commit and image tag
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            source_ref="$CI_COMMIT_SHA"
            image_tag="$CI_COMMIT_SHA"
          else
            source_ref="$GITHUB_SHA"
            image_tag="$MANUAL_IMAGE_TAG"
          fi
          test -n "$source_ref"
          test -n "$image_tag"
          echo "ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout matching source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Resolve image name
        shell: bash
        env:
          RESOLVED_TAG: ${{ steps.source.outputs.tag }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "OPENFOODFACTS_IMAGE=ghcr.io/$repository" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$RESOLVED_TAG" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact images published by CI
        run: |
          docker pull "$OPENFOODFACTS_IMAGE:$IMAGE_TAG"
          docker pull "$OPENFOODFACTS_IMAGE:test-$IMAGE_TAG"
          docker pull "$OPENFOODFACTS_IMAGE:hbase-$IMAGE_TAG"
          docker pull "$OPENFOODFACTS_IMAGE:data-mart-$IMAGE_TAG"

      - name: Validate Compose configurations
        run: |
          docker compose -f compose.lab5.yml config --quiet
          docker compose -f compose.lab6.yml config --quiet
          docker compose -f compose.lab7.yml config --quiet

      - name: Prepare writable artifact directories
        run: |
          mkdir -p output dist
          chmod 0777 output dist

      - name: Re-run tests from published test image
        run: >-
          docker compose -f compose.lab5.yml run
          --rm --no-deps
          tests tests
          --cov=openfoodfacts_cluster
          --cov-report=term-missing
          --cov-report=xml:/opt/application/output/coverage.xml

      - name: Verify published runtime image with WordCount
        shell: bash
        run: |
          docker compose -f compose.lab5.yml run --rm --no-deps wordcount \
            | tee output/wordcount.txt
          grep -q $'spark\t' output/wordcount.txt

      - name: Train model with published runtime image
        run: >-
          docker compose -f compose.lab5.yml run
          --rm --no-deps model

      - name: Build distribution with published runtime image
        run: >-
          docker compose -f compose.lab5.yml run
          --rm --no-deps distribution

      - name: Verify acceptance outputs
        run: |
          test -s output/coverage.xml
          test -s output/wordcount.txt
          test -s output/lab5/metrics.json
          test -d output/lab5/model
          test -n "$(find output/lab5/model -type f -print -quit)"
          test -n "$(find output/lab5/predictions -name 'part-*.json' -print -quit)"
          test -s dist/lab5-model.zip
          python -c 'import json; data=json.load(open("output/lab5/metrics.json")); assert data["input_rows"] == 42; assert data["usable_rows"] == 40; assert data["cluster_count"] == 4'

      - name: Upload accepted Lab 5 distribution
        uses: actions/upload-artifact@v7
        with:
          name: lab5-accepted-${{ steps.source.outputs.tag }}
          path: |
            output/coverage.xml
            output/wordcount.txt
            output/lab5/metrics.json
            dist/lab5-model.zip
          if-no-files-found: error
          retention-days: 30

      - name: Start published Lab 6 HBase image
        run: >-
          docker compose -f compose.lab6.yml up
          --detach --no-build --wait hbase

      - name: Seed Lab 6 source table
        run: >-
          docker compose -f compose.lab6.yml run
          --rm --no-deps hbase-seed

      - name: Run published Lab 6 model image
        run: >-
          docker compose -f compose.lab6.yml run
          --rm --no-deps model-lab6

      - name: Inspect accepted Lab 6 HBase results
        run: |
          docker compose -f compose.lab6.yml run --rm --no-deps \
            --entrypoint python3 hbase-seed \
            -m openfoodfacts_cluster.jobs.inspect_hbase \
            | tee output/lab6-hbase.txt

      - name: Verify accepted Lab 6 outputs
        run: |
          test -s output/lab6/metrics.json
          test -d output/lab6/model
          test -n "$(find output/lab6/model -type f -print -quit)"
          test -n "$(find output/lab6/predictions -name 'part-*.json' -print -quit)"
          grep -Fxq "off_products_raw: 40 rows" output/lab6-hbase.txt
          grep -Fxq "off_cluster_results: 40 rows" output/lab6-hbase.txt
          grep -Fxq "off_model_runs: 1 rows" output/lab6-hbase.txt
          grep -Eq "status=complete$" output/lab6-hbase.txt
          python -c 'import json; data=json.load(open("output/lab6/metrics.json")); assert data["input_rows"] == 40; assert data["usable_rows"] == 40; assert data["cluster_count"] == 4'

      - name: Upload accepted Lab 6 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lab6-accepted-${{ steps.source.outputs.tag }}
          path: |
            output/lab6-hbase.txt
            output/lab6/metrics.json
          if-no-files-found: error
          retention-days: 30

      - name: Stop Lab 6 before Lab 7 acceptance
        if: always()
        run: |
          docker compose -f compose.lab6.yml logs \
            --no-color --tail=500 > output/lab6-compose.log 2>&1 || true
          docker compose -f compose.lab6.yml down \
            --volumes --remove-orphans || true

      - name: Start published Lab 7 data mart stack
        run: >-
          docker compose -f compose.lab7.yml up
          --detach --no-build --wait data-mart

      - name: Run published Lab 7 model through the data mart
        shell: bash
        run: |
          docker compose -f compose.lab7.yml run --rm --no-deps model-lab7 \
            | tee output/lab7-model.txt

      - name: Inspect accepted Lab 7 HBase tables
        shell: bash
        run: |
          docker compose -f compose.lab7.yml run --rm --no-deps \
            --entrypoint python3 hbase-seed \
            -m openfoodfacts_cluster.jobs.inspect_hbase \
            | tee output/lab7-hbase.txt

      - name: Verify accepted Lab 7 outputs
        run: |
          test -s output/lab7/metrics.json
          test -d output/lab7/model
          test -n "$(find output/lab7/model -type f -print -quit)"
          test -n "$(find output/lab7/predictions -name 'part-*.json' -print -quit)"
          grep -Eq "trained=40, published=40, silhouette=" output/lab7-model.txt
          grep -Fxq "off_products_raw: 40 rows" output/lab7-hbase.txt
          grep -Fxq "off_products_prepared: 40 rows" output/lab7-hbase.txt
          grep -Fxq "off_datamart_meta: 1 rows" output/lab7-hbase.txt
          grep -Fxq "off_cluster_results: 40 rows" output/lab7-hbase.txt
          grep -Fxq "off_model_runs: 1 rows" output/lab7-hbase.txt
          grep -Eq "status=complete$" output/lab7-hbase.txt
          python -c 'import json; data=json.load(open("output/lab7/metrics.json")); assert data["input_rows"] == 40; assert data["usable_rows"] == 40; assert data["cluster_count"] == 4; assert data["preprocessing_owner"] == "scala-data-mart"'

      - name: Upload accepted Lab 7 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lab7-accepted-${{ steps.source.outputs.tag }}
          path: |
            output/lab7-model.txt
            output/lab7-hbase.txt
            output/lab7/metrics.json
          if-no-files-found: error
          retention-days: 30

      - name: Collect Lab 6 and Lab 7 Compose logs
        if: always()
        run: |
          test ! -f output/lab6-compose.log || cat output/lab6-compose.log
          docker compose -f compose.lab7.yml logs --no-color --tail=500 || true

      - name: Clean up Compose resources
        if: always()
        run: |
          docker compose -f compose.lab7.yml down --volumes --remove-orphans || true
          docker compose -f compose.lab6.yml down --volumes --remove-orphans || true
          docker compose -f compose.lab5.yml down --volumes --remove-orphans || true

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab5-lab8-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 110

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint dependencies
        run: python -m pip install ".[dev]"

      - name: Lint Python sources
        run: ruff check .

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v4.2.4

      - name: Validate Lab 8 Helm chart
        run: |
          for values_file in values-lab5.yaml values-lab6.yaml values-lab7.yaml; do
            helm lint deploy/helm/openfoodfacts-platform --strict \
              --values "deploy/helm/openfoodfacts-platform/$values_file"
            helm template openfoodfacts deploy/helm/openfoodfacts-platform \
              --values "deploy/helm/openfoodfacts-platform/$values_file" \
              > "/tmp/openfoodfacts-$values_file"
          done

      - name: Resolve image names
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "OPENFOODFACTS_IMAGE=ghcr.io/$repository" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Validate Compose configurations
        run: |
          docker compose -f compose.lab5.yml config --quiet
          docker compose -f compose.lab6.yml config --quiet
          docker compose -f compose.lab7.yml config --quiet

      - name: Build Spark runtime and test images
        run: |-
          source_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          docker build \
            --file Dockerfile.model \
            --target runtime \
            --label "org.opencontainers.image.source=$source_url" \
            --tag "$OPENFOODFACTS_IMAGE:$GITHUB_SHA" \
            --tag "$OPENFOODFACTS_IMAGE:latest" \
            .
          docker build \
            --file Dockerfile.model \
            --target test \
            --label "org.opencontainers.image.source=$source_url" \
            --tag "$OPENFOODFACTS_IMAGE:test-$GITHUB_SHA" \
            --tag "$OPENFOODFACTS_IMAGE:test-latest" \
            .

      - name: Build Lab 6 HBase image
        run: |-
          source_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          docker build \
            --file Dockerfile.hbase \
            --label "org.opencontainers.image.source=$source_url" \
            --tag "$OPENFOODFACTS_IMAGE:hbase-$GITHUB_SHA" \
            --tag "$OPENFOODFACTS_IMAGE:hbase-latest" \
            .

      - name: Build and test Lab 7 Scala data mart image
        run: |-
          source_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          docker build \
            --file Dockerfile.datamart \
            --target runtime \
            --label "org.opencontainers.image.source=$source_url" \
            --tag "$OPENFOODFACTS_IMAGE:data-mart-$GITHUB_SHA" \
            --tag "$OPENFOODFACTS_IMAGE:data-mart-latest" \
            .

      - name: Verify HBase ServiceLoader descriptors in data mart image
        run: |
          docker run --rm --entrypoint python3 \
            "$OPENFOODFACTS_IMAGE:data-mart-$GITHUB_SHA" \
            -c 'import zipfile; jar=zipfile.ZipFile("/opt/application/data-mart.jar"); required="META-INF/services/org.apache.hadoop.hbase.security.provider.SaslClientAuthenticationProvider"; assert required in jar.namelist(), f"missing {required}"'

      - name: Prepare writable artifact directories
        run: |
          mkdir -p output dist
          chmod 0777 output dist

      - name: Run unit and Spark tests in container
        run: >-
          docker compose -f compose.lab5.yml run
          --rm --no-deps
          tests tests
          --cov=openfoodfacts_cluster
          --cov-report=term-missing
          --cov-report=xml:/opt/application/output/coverage.xml

      - name: Run WordCount smoke test
        shell: bash
        run: |
          docker compose -f compose.lab5.yml run --rm --no-deps wordcount \
            | tee output/wordcount.txt
          grep -q $'spark\t' output/wordcount.txt

      - name: Train and persist Lab 5 model
        run: >-
          docker compose -f compose.lab5.yml run
          --rm --no-deps model

      - name: Build Lab 5 distribution
        run: >-
          docker compose -f compose.lab5.yml run
          --rm --no-deps distribution

      - name: Verify generated outputs
        run: |
          test -s output/coverage.xml
          test -s output/wordcount.txt
          test -s output/lab5/metrics.json
          test -d output/lab5/model
          test -n "$(find output/lab5/model -type f -print -quit)"
          test -n "$(find output/lab5/predictions -name 'part-*.json' -print -quit)"
          test -s dist/lab5-model.zip
          python -c 'import json; data=json.load(open("output/lab5/metrics.json")); assert data["input_rows"] == 42; assert data["usable_rows"] == 40; assert data["cluster_count"] == 4'

      - name: Upload Lab 5 test and model artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lab5-${{ github.sha }}
          path: |
            output/coverage.xml
            output/wordcount.txt
            output/lab5/metrics.json
            dist/lab5-model.zip
          if-no-files-found: error
          retention-days: 30

      - name: Start Lab 6 HBase
        run: >-
          docker compose -f compose.lab6.yml up
          --detach --no-build --wait hbase

      - name: Seed Lab 6 source table
        run: >-
          docker compose -f compose.lab6.yml run
          --rm --no-deps hbase-seed

      - name: Run Lab 6 model against HBase
        run: >-
          docker compose -f compose.lab6.yml run
          --rm --no-deps model-lab6

      - name: Inspect Lab 6 HBase results
        run: |
          docker compose -f compose.lab6.yml run --rm --no-deps \
            --entrypoint python3 hbase-seed \
            -m openfoodfacts_cluster.jobs.inspect_hbase \
            | tee output/lab6-hbase.txt

      - name: Verify Lab 6 outputs
        run: |
          test -s output/lab6/metrics.json
          test -d output/lab6/model
          test -n "$(find output/lab6/model -type f -print -quit)"
          test -n "$(find output/lab6/predictions -name 'part-*.json' -print -quit)"
          grep -Fxq "off_products_raw: 40 rows" output/lab6-hbase.txt
          grep -Fxq "off_cluster_results: 40 rows" output/lab6-hbase.txt
          grep -Fxq "off_model_runs: 1 rows" output/lab6-hbase.txt
          grep -Eq "status=complete$" output/lab6-hbase.txt
          python -c 'import json; data=json.load(open("output/lab6/metrics.json")); assert data["input_rows"] == 40; assert data["usable_rows"] == 40; assert data["cluster_count"] == 4'

      - name: Upload Lab 6 verification artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lab6-${{ github.sha }}
          path: |
            output/lab6-hbase.txt
            output/lab6/metrics.json
          if-no-files-found: error
          retention-days: 30

      - name: Stop Lab 6 before Lab 7 acceptance
        if: always()
        run: |
          docker compose -f compose.lab6.yml logs \
            --no-color --tail=500 > output/lab6-compose.log 2>&1 || true
          docker compose -f compose.lab6.yml down \
            --volumes --remove-orphans || true

      - name: Verify Lab 7 source boundary
        run: |
          grep -q "train_prepared_and_persist" src/openfoodfacts_cluster/jobs/run_lab7.py
          if grep -Eq "HBaseRestClient|openfoodfacts_cluster\.hbase" \
            src/openfoodfacts_cluster/jobs/run_lab7.py; then
            echo "Lab 7 model must access HBase only through the data mart" >&2
            exit 1
          fi

      - name: Start Lab 7 data mart stack
        shell: bash
        run: |
          if ! docker compose -f compose.lab7.yml up \
            --detach --no-build --wait data-mart; then
            docker compose -f compose.lab7.yml ps --all
            docker compose -f compose.lab7.yml logs --no-color --tail=500
            exit 1
          fi

      - name: Run Lab 7 model through the data mart
        shell: bash
        run: |
          docker compose -f compose.lab7.yml run --rm --no-deps model-lab7 \
            | tee output/lab7-model.txt

      - name: Inspect Lab 7 HBase tables
        shell: bash
        run: |
          docker compose -f compose.lab7.yml run --rm --no-deps \
            --entrypoint python3 hbase-seed \
            -m openfoodfacts_cluster.jobs.inspect_hbase \
            | tee output/lab7-hbase.txt

      - name: Verify Lab 7 outputs
        run: |
          test -s output/lab7/metrics.json
          test -d output/lab7/model
          test -n "$(find output/lab7/model -type f -print -quit)"
          test -n "$(find output/lab7/predictions -name 'part-*.json' -print -quit)"
          grep -Eq "trained=40, published=40, silhouette=" output/lab7-model.txt
          grep -Fxq "off_products_raw: 40 rows" output/lab7-hbase.txt
          grep -Fxq "off_products_prepared: 40 rows" output/lab7-hbase.txt
          grep -Fxq "off_datamart_meta: 1 rows" output/lab7-hbase.txt
          grep -Fxq "off_cluster_results: 40 rows" output/lab7-hbase.txt
          grep -Fxq "off_model_runs: 1 rows" output/lab7-hbase.txt
          grep -Eq "status=complete$" output/lab7-hbase.txt
          python -c 'import json; data=json.load(open("output/lab7/metrics.json")); assert data["input_rows"] == 40; assert data["usable_rows"] == 40; assert data["cluster_count"] == 4; assert data["preprocessing_owner"] == "scala-data-mart"'

      - name: Upload Lab 7 verification artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lab7-${{ github.sha }}
          path: |
            output/lab7-model.txt
            output/lab7-hbase.txt
            output/lab7/metrics.json
          if-no-files-found: error
          retention-days: 30

      - name: Stop Compose before Lab 8 acceptance
        if: always()
        run: |
          docker compose -f compose.lab7.yml logs \
            --no-color --tail=500 > output/lab7-compose.log 2>&1 || true
          docker compose -f compose.lab7.yml down \
            --volumes --remove-orphans || true

      - name: Tag tested images for kind
        run: |
          docker tag "$OPENFOODFACTS_IMAGE:$GITHUB_SHA" openfoodfacts-model:lab8
          docker tag "$OPENFOODFACTS_IMAGE:data-mart-$GITHUB_SHA" \
            openfoodfacts-data-mart:lab8
          docker tag "$OPENFOODFACTS_IMAGE:hbase-$GITHUB_SHA" \
            openfoodfacts-hbase:lab8

      - name: Create Lab 8 Kubernetes cluster
        uses: helm/kind-action@v1.14.0
        with:
          version: v0.32.0
          kubectl_version: v1.36.1
          cluster_name: openfoodfacts-lab8
          config: config/kind-cluster.yaml
          wait: 120s

      - name: Load tested images into kind
        run: |
          kind load docker-image --name openfoodfacts-lab8 \
            openfoodfacts-model:lab8 \
            openfoodfacts-data-mart:lab8 \
            openfoodfacts-hbase:lab8

      - name: Run Lab 8 Kubernetes acceptance
        run: ./scripts/k8s-acceptance.sh

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$OPENFOODFACTS_IMAGE:$GITHUB_SHA"
          docker push "$OPENFOODFACTS_IMAGE:latest"
          docker push "$OPENFOODFACTS_IMAGE:test-$GITHUB_SHA"
          docker push "$OPENFOODFACTS_IMAGE:test-latest"
          docker push "$OPENFOODFACTS_IMAGE:hbase-$GITHUB_SHA"
          docker push "$OPENFOODFACTS_IMAGE:hbase-latest"
          docker push "$OPENFOODFACTS_IMAGE:data-mart-$GITHUB_SHA"
          docker push "$OPENFOODFACTS_IMAGE:data-mart-latest"

      - name: Collect Lab 6-Lab 8 diagnostics
        if: always()
        run: |
          test ! -f output/lab6-compose.log || cat output/lab6-compose.log
          test ! -f output/lab7-compose.log || cat output/lab7-compose.log
          if kubectl cluster-info >/dev/null 2>&1; then
            mkdir -p output/lab8
            kubectl get pods,jobs,statefulsets,deployments,services,pvc,pdb \
              --namespace openfoodfacts --output wide \
              | tee output/lab8/resources-final.txt || true
            kubectl get events --namespace openfoodfacts \
              --sort-by=.metadata.creationTimestamp \
              > output/lab8/events.txt || true
            for pod in $(kubectl get pods --namespace openfoodfacts \
              --output jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              kubectl logs "$pod" --namespace openfoodfacts \
                --all-containers --tail=300 \
                > "output/lab8/${pod}.log" 2>&1 || true
            done
          fi

      - name: Upload Lab 8 Kubernetes evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab8-${{ github.sha }}
          path: output/lab8
          if-no-files-found: ignore
          retention-days: 30

      - name: Clean up Compose resources
        if: always()
        run: |
          docker compose -f compose.lab7.yml down --volumes --remove-orphans || true
          docker compose -f compose.lab6.yml down --volumes --remove-orphans || true
          docker compose -f compose.lab5.yml down --volumes --remove-orphans || true

[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "openfoodfacts-cluster"
version = "0.1.0"
description = "PySpark clustering pipeline for Open Food Facts"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
local = ["pyspark==3.5.9"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "spark: test starts a local Spark session",
  "integration: test uses more than one application component",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]